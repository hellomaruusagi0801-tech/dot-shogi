<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ねこパンチ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* ファミコン調の単一テーマ（ドット将棋・さかなつりとそろえた配色） */
:root{
  --k:#000000; --w:#FCFCFC; --cream:#FCE0A8; --yellow:#F8B800; --orange:#FCA044;
  --red:#D82800; --green:#00A800; --sky:#3CBCFC;
  --font:'DotGothic16','MS Gothic','Osaka-Mono',monospace;
  --sw:min(100%,480px,calc((100dvh - 110px)*2/3));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--k);color:var(--cream);font-family:var(--font);min-height:100dvh;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;gap:8px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.top,.hud{width:var(--sw);min-width:240px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top a{color:var(--cream);text-decoration:none;font-size:14px}
h1{font-size:20px;font-weight:400;margin:0;color:var(--yellow);letter-spacing:.1em}
.icon{font:inherit;font-size:13px;background:none;border:2px solid var(--cream);color:var(--cream);padding:2px 8px;cursor:pointer}
.hud{font-size:16px;font-variant-numeric:tabular-nums}
.hud b{font-weight:400;color:var(--w)}
.hud .warn{color:var(--red)}
.stage{position:relative;width:var(--sw);min-width:240px;aspect-ratio:2/3;
  box-shadow:0 -4px 0 0 var(--cream),0 4px 0 0 var(--cream),-4px 0 0 0 var(--cream),4px 0 0 0 var(--cream)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:pointer}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:safe center;
  gap:10px;padding:16px;text-align:center;overflow:auto;font-size:clamp(12px,3.4vw,15px);line-height:1.6}
.overlay h2{font-size:clamp(22px,7vw,30px);font-weight:400;margin:0;color:var(--yellow);letter-spacing:.1em}
.overlay p{margin:0}
.how{text-align:left;margin:0;padding:0;list-style:none}
.how li::before{content:'▶ ';color:var(--orange)}
.how img{image-rendering:pixelated;width:32px;height:auto;vertical-align:middle;margin-right:4px}
.score{font-size:clamp(26px,9vw,38px);color:var(--w)}
.new{color:var(--red);animation:blink .5s steps(1) infinite}
@keyframes blink{50%{color:var(--yellow)}}
.btn{font:inherit;font-size:18px;background:var(--yellow);color:var(--k);border:0;padding:8px 26px;cursor:pointer;box-shadow:0 4px 0 #AC7C00}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #AC7C00}
.btn:focus-visible,.icon:focus-visible,.top a:focus-visible{outline:2px dashed var(--w);outline-offset:3px}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:clamp(14px,4.5vw,20px);color:var(--w);pointer-events:none;
  text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000;animation:up .7s steps(7) forwards;white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:1s;animation-timing-function:linear}.new{animation:none}}
</style>
</head>
<body>
<div class="top">
  <a href="../">◀ もどる</a>
  <h1>ねこパンチ</h1>
  <button class="icon" id="mute" type="button">♪ON</button>
</div>
<div class="hud">
  <span>のこり <b id="time">30</b>びょう</span>
  <span id="combo"></span>
  <span>スコア <b id="score">0</b></span>
</div>
<div class="stage" id="stage">
  <canvas id="cv" width="180" height="270"></canvas>
  <div class="overlay" id="title">
    <h2>ねこパンチ</h2>
    <ul class="how">
      <li><img id="iMouse" alt="">ねずみ 10てん</li>
      <li><img id="iFish" alt="">さかな 30てん（すぐ にげる）</li>
      <li><img id="iCuke" alt="">きゅうり は さわると −5びょう！</li>
      <li>つづけて とると コンボで てんすう アップ</li>
    </ul>
    <p>タップした ところに にくきゅうが のこるよ</p>
    <button class="btn" id="start" type="button">スタート</button>
    <p id="bestTitle"></p>
  </div>
  <div class="overlay" id="result" hidden>
    <h2>おしまい！</h2>
    <p class="score" id="rScore">0</p>
    <p id="rNew" class="new" hidden>ハイスコア こうしん！</p>
    <p id="rRank"></p>
    <p id="rDetail"></p>
    <button class="btn" id="again" type="button">もういっかい</button>
    <p id="rBest"></p>
  </div>
</div>
<script>
'use strict';
// ===== 共通：ドット絵・肉球・音 =====
const PAL = {K:'#000000',w:'#FCFCFC',c:'#FCE0A8',y:'#F8B800',o:'#FCA044',r:'#D82800',b:'#503000',t:'#AC7C00',
  g:'#00A800',G:'#B8F818',s:'#3CBCFC',S:'#0078F8',e:'#BCBCBC',E:'#7C7C7C',p:'#F878F8',n:'#FCD8A8'};
function sprite(rows, outline = true) {
  const h = rows.length, w = rows[0].length, pad = outline ? 1 : 0;
  const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2;
  const x = c.getContext('2d');
  if (outline) {
    x.fillStyle = '#000';
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (rows[j][i] !== '.')
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) x.fillRect(i + pad + dx, j + pad + dy, 1, 1);
  }
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const ch = rows[j][i]; if (ch === '.') continue;
    x.fillStyle = PAL[ch]; x.fillRect(i + pad, j + pad, 1, 1);
  }
  return c;
}
function rot(rows) { // 時計回りに90度
  const h = rows.length, w = rows[0].length, out = [];
  for (let x = 0; x < w; x++) { let s = ''; for (let y = h - 1; y >= 0; y--) s += rows[y][x]; out.push(s); }
  return out;
}
const PAW_ROWS = [
  "...KK....KK...",
  "..KKKK..KKKK..",
  "..KKKK..KKKK..",
  "...KK....KK...",
  "KK..........KK",
  "KKK........KKK",
  "KKK..KKKK..KKK",
  ".K..KKKKKK..K.",
  "...KKKKKKKK...",
  "..KKKKKKKKKK..",
  "..KKKKKKKKKK..",
  "..KKKKKKKKKK..",
  "...KKKKKKKK...",
  "....KK..KK....",
];
const PAWS = []; { let r = PAW_ROWS; for (let i = 0; i < 4; i++) { PAWS.push(sprite(r, false)); r = rot(r); } } // 上・右・下・左

let actx = null, muted = false;
try { muted = localStorage.getItem('nikukyu-mute') === '1'; } catch (e) {}
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, dur, type = 'square', vol = .12, f2 = null, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + delay, n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
function sPaw() { noise(.07, .5, 650); tone(170 + Math.random() * 50, .09, 'sine', .3, 80); }
function sNya(p = 1, dur = .45, vol = .3) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime, o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = 'sawtooth'; f.type = 'bandpass'; f.Q.value = 2.5;
  o.frequency.setValueAtTime(430 * p, t); o.frequency.linearRampToValueAtTime(720 * p, t + dur * .35); o.frequency.linearRampToValueAtTime(380 * p, t + dur);
  f.frequency.setValueAtTime(900 * p, t); f.frequency.linearRampToValueAtTime(1900 * p, t + dur * .35); f.frequency.linearRampToValueAtTime(800 * p, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .05); g.gain.setValueAtTime(vol, t + dur * .6); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function jingle(notes, step = .1, type = 'square', vol = .1) { notes.forEach((n, i) => n && tone(n, step * 1.5, type, vol, null, i * step)); }
const muteBtn = document.getElementById('mute');
function showMute() { muteBtn.textContent = muted ? '♪OFF' : '♪ON'; muteBtn.setAttribute('aria-label', muted ? '音をつける' : '音をけす'); }
muteBtn.onclick = () => { muted = !muted; try { localStorage.setItem('nikukyu-mute', muted ? '1' : '0'); } catch (e) {} showMute(); if (!muted) sPaw(); };
showMute();
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ===== ねこパンチ =====
const W = 180, H = 270, GAME_TIME = 30;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const stage = $('stage');

const MOUSE = sprite([
  "...........ee..",
  "..........eppe.",
  "....eeeeeeeepe.",
  "..eeeeeeeeeee..",
  ".eeeeeeeeeeKee.",
  "eeeeeeeeeeeeeep",
  "eeeeeeeeeeeeee.",
  ".eeeeeeeeeeee..",
  "..p.p....p.p...",
]);
const MOUSE_L = sprite([
  "..ee...........",
  ".eppe..........",
  ".epeeeeeeee....",
  "..eeeeeeeeeee..",
  ".eeKeeeeeeeeee.",
  "peeeeeeeeeeeeee",
  ".eeeeeeeeeeeeee",
  "..eeeeeeeeeeee.",
  "...p.p....p.p..",
]);
const FISH = sprite([
  "....ssss......",
  "..ssssssss..ss",
  ".sKssssssssss.",
  "ssssssSsssss..",
  ".ssssssssssss.",
  "..ssssssss..ss",
  "....ssss......",
]);
const CUKE = sprite([
  "...gggggggggg...",
  ".gggGgggGgggGgg.",
  "gggggggggggggggt",
  "ggGgggGgggGggggt",
  ".gggggggggggggg.",
  "...gggggggggg...",
]);
const TAIL = sprite(["ppp"], false);
$('iMouse').src = MOUSE.toDataURL(); $('iFish').src = FISH.toDataURL(); $('iCuke').src = CUKE.toDataURL();

// 床（木の板）
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
{
  const g = bg.getContext('2d');
  g.fillStyle = PAL.c; g.fillRect(0, 0, W, H);
  g.fillStyle = '#ECCA8C';
  for (let y = 0; y < H; y += 18) {
    g.fillRect(0, y, W, 1);
    const off = (y / 18) % 2 ? 30 : 0;
    for (let x = off; x < W; x += 60) g.fillRect(x, y, 1, 18);
  }
  g.fillStyle = '#F4D69C';
  for (let i = 0; i < 140; i++) g.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 3, 1);
}
// 肉球のあとを残すレイヤー
const prints = document.createElement('canvas'); prints.width = W; prints.height = H;
const pctx = prints.getContext('2d'); pctx.imageSmoothingEnabled = false;
function stamp(x, y) { pctx.drawImage(PAWS[0], Math.round(x - 7), Math.round(y - 7)); }

let state = 'title', time = GAME_TIME, score = 0, combo = 0, maxCombo = 0, caught = 0, cukes = 0;
let targets = [], parts = [], spawnT = 0, shake = 0, elapsed = 0;
let best = load('nikukyu-punch-best', 0);
$('bestTitle').textContent = best ? `ハイスコア ${best}` : '';

function spawn() {
  const p = elapsed / GAME_TIME;
  const maxAlive = 3 + Math.floor(p * 3);
  if (targets.filter(t => !t.dead).length >= maxAlive) return;
  let type = 'mouse'; const r = Math.random();
  if (r < .18) type = 'fish'; else if (r < .34 && elapsed > 3) type = 'cuke';
  let x, y, tries = 0;
  do {
    x = 16 + Math.random() * (W - 32); y = 18 + Math.random() * (H - 36); tries++;
  } while (tries < 20 && targets.some(t => Math.hypot(t.x - x, t.y - y) < 30));
  const life = type === 'fish' ? .95 - .3 * p : type === 'cuke' ? 1.6 : 1.5 - .55 * p;
  targets.push({ type, x, y, age: 0, life, dead: false, flip: Math.random() < .5 });
}

function popText(x, y, text, color) {
  const d = document.createElement('div'); d.className = 'pop'; d.textContent = text; d.style.color = color;
  d.style.left = (x / W * 100) + '%'; d.style.top = (y / H * 100) + '%';
  stage.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 2 * i / n + Math.random() * .4, v = 40 + Math.random() * 40;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .35 + Math.random() * .2, color });
  }
}

function tap(x, y) {
  if (state !== 'play') return;
  stamp(x, y); sPaw();
  burst(x, y, '#E0B878', 6);
  let hit = null;
  for (let i = targets.length - 1; i >= 0; i--) {
    const t = targets[i]; if (t.dead) continue;
    if (Math.hypot(t.x - x, t.y - y) < 15) { hit = t; break; }
  }
  if (!hit) { if (combo >= 3) popText(x, y - 10, 'ミス', '#FCFCFC'); combo = 0; updHud(); return; }
  hit.dead = true;
  if (hit.type === 'cuke') {
    time = Math.max(0, time - 5); combo = 0; shake = .4; cukes++;
    sNya(1.5, .35, .35); tone(300, .25, 'square', .1, 120);
    popText(hit.x, hit.y, 'ヒェッ −5びょう', '#D82800');
    burst(hit.x, hit.y, '#00A800', 10);
  } else {
    const base = hit.type === 'fish' ? 30 : 10;
    const pts = base + combo * 2;
    score += pts; combo++; caught++; maxCombo = Math.max(maxCombo, combo);
    if (hit.type === 'fish') { jingle([1046, 1318, 1568], .05, 'square', .09); }
    else { tone(1900, .06, 'square', .08, 2600); tone(1400, .08, 'triangle', .1, null, .05); }
    if (combo > 0 && combo % 10 === 0) { sNya(1.1, .4, .25); popText(W / 2, H / 2, combo + ' コンボ！', '#F8B800'); }
    popText(hit.x, hit.y - 6, '+' + pts, hit.type === 'fish' ? '#3CBCFC' : '#FCFCFC');
    burst(hit.x, hit.y, '#F8B800', 10);
  }
  updHud();
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  tap((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
});

function updHud() {
  const tEl = $('time'); tEl.textContent = Math.ceil(time); tEl.className = time <= 5 ? 'warn' : '';
  $('score').textContent = score;
  $('combo').textContent = combo >= 2 ? combo + 'コンボ' : '';
}

function startGame() {
  ac(); sNya(1, .4, .25);
  pctx.clearRect(0, 0, W, H);
  state = 'play'; time = GAME_TIME; score = 0; combo = 0; maxCombo = 0; caught = 0; cukes = 0; elapsed = 0;
  targets = []; parts = []; spawnT = .4;
  $('title').hidden = true; $('result').hidden = true; updHud();
}
function endGame() {
  state = 'result'; targets.forEach(t => t.dead = true);
  jingle([784, 659, 523, 659, 784, 1046], .11);
  const isNew = score > best; if (isNew) { best = score; save('nikukyu-punch-best', best); }
  $('rScore').textContent = score + ' てん';
  $('rNew').hidden = !isNew;
  const rank = score >= 1000 ? 'ねこの おやぶん' : score >= 600 ? 'かりの めいじん' : score >= 300 ? 'いえねこ' : 'こねこ';
  $('rRank').textContent = 'しょうごう：' + rank;
  $('rDetail').textContent = `つかまえた かず ${caught}　さいだいコンボ ${maxCombo}` + (cukes ? `　きゅうり ${cukes}` : '');
  $('rBest').textContent = 'ハイスコア ' + best;
  setTimeout(() => { $('result').hidden = false; $('again').focus(); }, 500);
}
$('start').onclick = startGame;
$('again').onclick = startGame;

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play') {
    time -= dt; elapsed += dt;
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = .85 - .4 * (elapsed / GAME_TIME) + Math.random() * .2; }
    for (const t of targets) {
      t.age += dt;
      if (!t.dead && t.age > t.life) { t.dead = true; if (t.type !== 'cuke' && combo >= 3) popText(t.x, t.y, 'にげた', '#BCBCBC'); if (t.type !== 'cuke') combo = 0; }
    }
    targets = targets.filter(t => !t.dead);
    if (time <= 0) { time = 0; endGame(); }
    updHud();
  }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .9; p.vy *= .9; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt);

  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - .5) * 6), Math.round((Math.random() - .5) * 6));
  ctx.drawImage(bg, 0, 0); ctx.drawImage(prints, 0, 0);
  for (const t of targets) {
    const rise = Math.min(1, t.age / .12);
    const left = t.life - t.age;
    if (left < .3 && Math.floor(left * 16) % 2 === 0) continue; // にげる前に点滅
    let spr = t.type === 'fish' ? FISH : t.type === 'cuke' ? CUKE : (t.flip ? MOUSE_L : MOUSE);
    let ox = 0, oy = Math.round((1 - rise) * 6);
    if (t.type === 'mouse') ox = Math.floor(t.age * 6) % 2;
    if (t.type === 'fish') oy -= Math.round(Math.abs(Math.sin(t.age * 9)) * 4);
    // かげ
    ctx.fillStyle = 'rgba(80,48,0,.25)'; ctx.fillRect(Math.round(t.x - spr.width / 2 + 2), Math.round(t.y + spr.height / 2), spr.width - 4, 2);
    ctx.drawImage(spr, Math.round(t.x - spr.width / 2 + ox), Math.round(t.y - spr.height / 2 + oy));
    if (t.type === 'mouse') ctx.drawImage(TAIL, Math.round(t.x + (t.flip ? spr.width / 2 - 1 : -spr.width / 2 - 2) + ox), Math.round(t.y + 1 + oy));
  }
  for (const p of parts) { ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
